[project]
name = "data-viz-guru"
version = "0.1.0"
description = "Financial and investment data visualisation toolkit and Claude skill: static, interactive, animated."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "pandas>=2.1", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
interactive = ["plotly>=5.20"]
dev = ["pytest>=8", "plotly>=5.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Animation was deleted:UserWarning"]
