name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install -e ".[dev]"
      - name: Palette check (colour-blind separation, contrast)
        run: PYTHONPATH=skill/data-viz-guru/scripts python -m vizguru.lint --palette
      - name: Unit tests
        run: pytest -q
      - name: Build the gallery (every chart is linted; any error fails the build)
        run: python examples/build_gallery.py
      - uses: actions/upload-artifact@v4
        with: {name: gallery, path: examples/gallery}
      - name: Package the skill
        run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with: {name: data-viz-guru-skill, path: dist/data-viz-guru.skill}
